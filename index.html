<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matma E8</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like an exam booklet; tasks sit on squared notebook paper, ink-blue pen accent, highlighter for marks. */
:root{
  --bg:#f3f5fa; --paper:#ffffff; --fg:#151b2e; --muted:#586179; --line:#d9dfec; --grid:#e8ecf5;
  --accent:#2346c9; --accent-soft:#e2e8fd; --on-accent:#ffffff;
  --mark:rgba(255,214,51,.55);
  --ok:#1b7a45; --ok-soft:#dff2e6; --bad:#c2352b; --bad-soft:#fbe4e1;
  --c1:#2346c9; --c2:#6f8be6; --c3:#aebef3; --c4:#e8962c;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1220; --paper:#161b2b; --fg:#e6e9f3; --muted:#9ba3b9; --line:#2a3148; --grid:#1d2335;
  --accent:#8ea7ff; --accent-soft:#222c52; --on-accent:#0e1220; --mark:rgba(255,214,51,.28);
  --ok:#62d297; --ok-soft:#14331f; --bad:#ff8174; --bad-soft:#3b1b19;
  --c1:#8ea7ff; --c2:#5a74cf; --c3:#36457f; --c4:#e6a24c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1220; --paper:#161b2b; --fg:#e6e9f3; --muted:#9ba3b9; --line:#2a3148; --grid:#1d2335;
  --accent:#8ea7ff; --accent-soft:#222c52; --on-accent:#0e1220; --mark:rgba(255,214,51,.28);
  --ok:#62d297; --ok-soft:#14331f; --bad:#ff8174; --bad-soft:#3b1b19;
  --c1:#8ea7ff; --c2:#5a74cf; --c3:#36457f; --c4:#e6a24c; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hl{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 .1em}
.muted{color:var(--muted)}
.eyebrow{font:700 .75rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 18px}
.brand{font:800 1.25rem var(--display);display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.brand .sq{width:26px;height:26px;border:2px solid var(--accent);border-radius:4px;display:grid;place-items:center;font:700 .8rem var(--mono);color:var(--accent)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700}
.nav button[aria-current="page"]{color:var(--fg);background:var(--accent-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{border-color:var(--line);background:var(--paper);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);background:var(--bad);color:var(--paper)}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:8px 8px}
.hero p{max-width:52ch}
.count{text-align:right;font-family:var(--mono)}
.count b{display:block;font-size:3.2rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.facts div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.facts div:first-child{border-left:0}
.facts b{display:block;font:700 1.15rem var(--mono);font-variant-numeric:tabular-nums}
.facts span{font-size:.85rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.mode:hover{border-color:var(--accent)}
.mode .go{margin-top:auto;color:var(--accent);font-weight:700}
.links{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.links li{display:grid;grid-template-columns:2rem 1fr;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.links .n{font:700 .9rem var(--mono);color:var(--muted);padding-top:2px}
.links a{font-weight:700}
.hist{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* topics */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.topic{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.topic:hover{border-color:var(--accent)}
.topic .meta{display:flex;justify-content:space-between;font:500 .85rem var(--mono);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.b{background:var(--bad)}

/* task */
.task{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.task-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.task-h .num{font:800 1.1rem var(--display)}
.pts{font:700 .8rem var(--mono);padding:3px 8px;border-radius:6px;background:var(--mark);color:var(--fg)}
.tag{font-size:.85rem;color:var(--muted)}
.q{font-size:1.08rem}
.q p+p{margin-top:8px}
.instr{font-size:.9rem;color:var(--muted)}
.fig-wrap{overflow-x:auto;background:var(--paper);border-radius:8px;padding:6px 0}
.fig{display:block;max-width:100%;height:auto;margin:0 auto}
.fig text{fill:var(--fg);font:12px var(--mono)}
.fig .ax{stroke:var(--muted);stroke-width:1.2;fill:none}
.fig .gl{stroke:var(--line);stroke-width:1;fill:none}
.fig .col{fill:var(--accent)}
.fig .ln{stroke:var(--accent);stroke-width:2.5;fill:none}
.fig .dot{fill:var(--accent)}
.fig .shape{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.fig .hole{fill:var(--paper);stroke:var(--accent);stroke-width:2}
.fig .s1{fill:var(--c1)} .fig .s2{fill:var(--c2)} .fig .s3{fill:var(--c3)} .fig .s4{fill:var(--c4)}
table.data{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums;background:var(--paper)}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--accent-soft)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:700 .85rem var(--mono)}
.opt .t{min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt:disabled{cursor:default;opacity:1}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.pf{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.pf-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.pf-row:first-child{border-top:0}
.pf-s{min-width:0}
.pf-b{display:flex;gap:6px}
.pf-b .opt{padding:6px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp .opts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.numin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.numin input{font:700 1.15rem var(--mono);width:12rem;max-width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--fg)}
.numin input:focus{border-color:var(--accent);outline:none}
.numin.ok input{border-color:var(--ok);background:var(--ok-soft)}
.numin.bad input{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:110px;font:1rem/1.5 var(--mono);padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--fg);resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}

.hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hints li{border-left:4px solid var(--c4);background:var(--paper);padding:8px 12px;border-radius:0 8px 8px 0}
.hints b{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:block}
.fb{padding:12px 14px;border-radius:10px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--accent-soft);color:var(--fg)}
.sol{background:var(--paper);border:1px dashed var(--accent);border-radius:12px;padding:14px 16px}
.sol h3{margin-bottom:6px;color:var(--accent)}
.sol p+p{margin-top:6px}
.crit{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.crit label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.crit input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}

.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);background:var(--paper);font:700 .8rem var(--mono);cursor:pointer}
.dots button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.dots button.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.dots button[aria-current="true"]{outline:3px solid var(--accent);outline-offset:1px}
.back{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}

/* exam */
.ebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.timer{font:700 1.6rem var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.part{font:800 1rem var(--display);padding-top:8px;border-top:2px solid var(--fg)}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.score .big{font:700 3rem/1 var(--mono);font-variant-numeric:tabular-nums}
.score .big small{font-size:1.2rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.brk{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.brk td,table.brk th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.brk td:last-child,table.brk th:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
.pause{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}

/* math */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.rt{white-space:nowrap}
.rt>span{border-top:1.5px solid currentColor;padding:0 .1em;margin-left:.05em}

@media (max-width:620px){
  h1{font-size:1.8rem}
  .hero{grid-template-columns:1fr}
  .count{text-align:left}
  .facts{grid-template-columns:1fr 1fr}
  .facts div:nth-child(3){border-left:0}
  .facts div:nth-child(n+3){border-top:1px solid var(--line)}
  .modes{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .task{padding:16px}
  .score{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .opt,.mode,.topic{transition:border-color .15s,background-color .15s} }
html,body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <button class="brand" type="button" data-go="home"><span class="sq">E8</span>Matma E8</button>
    <nav class="nav" aria-label="Menu">
      <button type="button" data-go="home">Start</button>
      <button type="button" data-go="topics">Ćwiczenia</button>
      <button type="button" data-go="exam">Egzamin próbny</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<script>
// ---------- math helpers ----------
const f=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const rt=x=>`<span class="rt">√<span>${x}</span></span>`;
const cb=x=>`<span class="rt"><sup>3</sup>√<span>${x}</span></span>`;

// ---------- figure generators (all marks on one scale) ----------
function barChart(cats,vals,xl,yl){
  const W=360,H=230,L=44,B=40,T=16,R=12,step=2,max=Math.ceil(Math.max(...vals)/step)*step;
  const ph=H-B-T,pw=W-L-R,sy=ph/max,bw=pw/cats.length;
  let g='';
  for(let v=0;v<=max;v+=step){const y=T+ph-v*sy;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${v}</text>`}
  cats.forEach((c,i)=>{const h=vals[i]*sy,x=L+i*bw+bw*.2;g+=`<rect class="col" x="${x}" y="${T+ph-h}" width="${bw*.6}" height="${h}" rx="2"/><text x="${x+bw*.3}" y="${H-B+16}" text-anchor="middle">${c}</text>`});
  g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/><line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}"/>`;
  g+=`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle">${xl}</text><text x="12" y="${T+ph/2}" text-anchor="middle" transform="rotate(-90 12 ${T+ph/2})">${yl}</text>`;
  return `<svg class="fig" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Diagram słupkowy">${g}</svg>`;
}
function lineChart(xs,ys,xl,yl){
  const W=380,H=230,L=44,B=40,T=16,R=16,step=2,max=Math.ceil(Math.max(...ys)/step)*step;
  const ph=H-B-T,pw=W-L-R,sy=ph/max,sx=pw/(xs.length-1);
  let g='';
  for(let v=0;v<=max;v+=step){const y=T+ph-v*sy;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${v}</text>`}
  const pts=ys.map((v,i)=>[L+i*sx,T+ph-v*sy]);
  xs.forEach((x,i)=>{g+=`<line class="gl" x1="${L+i*sx}" x2="${L+i*sx}" y1="${T}" y2="${T+ph}"/><text x="${L+i*sx}" y="${H-B+16}" text-anchor="middle">${x}</text>`});
  g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/><line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}"/>`;
  g+=`<polyline class="ln" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('');
  g+=`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle">${xl}</text><text x="12" y="${T+ph/2}" text-anchor="middle" transform="rotate(-90 12 ${T+ph/2})">${yl}</text>`;
  return `<svg class="fig" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Wykres liniowy">${g}</svg>`;
}
function pieChart(sl){
  const cx=100,cy=100,r=85;let a0=-Math.PI/2,g='';
  sl.forEach((s,i)=>{const a1=a0+s.p/100*2*Math.PI,large=s.p>50?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    g+=`<path class="s${i+1}" d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z"/>`;
    g+=`<rect class="s${i+1}" x="210" y="${40+i*30}" width="16" height="16" rx="3"/><text x="234" y="${53+i*30}">${s.l} – ${s.p}%</text>`;a0=a1});
  return `<svg class="fig" viewBox="0 0 380 200" width="380" role="img" aria-label="Diagram kołowy">${g}</svg>`;
}
function coordRect(){
  const u=30,x0=-2,x1=6,y0=-2,y1=4,ox=20+(-x0)*u,oy=20+y1*u,W=40+(x1-x0)*u,H=40+(y1-y0)*u;
  let g='';for(let x=x0;x<=x1;x++)g+=`<line class="gl" x1="${ox+x*u}" x2="${ox+x*u}" y1="20" y2="${H-20}"/>`;
  for(let y=y0;y<=y1;y++)g+=`<line class="gl" x1="20" x2="${W-20}" y1="${oy-y*u}" y2="${oy-y*u}"/>`;
  g+=`<line class="ax" x1="20" x2="${W-14}" y1="${oy}" y2="${oy}"/><line class="ax" x1="${ox}" x2="${ox}" y1="14" y2="${H-20}"/>`;
  g+=`<text x="${W-14}" y="${oy-6}" text-anchor="end">x</text><text x="${ox+6}" y="24">y</text><text x="${ox+u-4}" y="${oy+15}">1</text><text x="${ox-12}" y="${oy-u+4}">1</text>`;
  const P=[[-1,-1,'A'],[5,-1,'B'],[5,3,'C'],[-1,3,'D']];
  g+=`<polygon class="shape" points="${P.map(p=>(ox+p[0]*u)+','+(oy-p[1]*u)).join(' ')}"/>`;
  P.forEach(p=>{g+=`<circle class="dot" cx="${ox+p[0]*u}" cy="${oy-p[1]*u}" r="4"/><text x="${ox+p[0]*u+(p[0]<0?-16:6)}" y="${oy-p[1]*u+(p[1]<0?16:-6)}">${p[2]}</text>`});
  return `<svg class="fig" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Prostokąt w układzie współrzędnych">${g}</svg>`;
}
function squareHole(){
  const s=20,x=40,y=20;

{id:'e8',t:'rownania',type:'abcd',q:'6 robotników wykona pracę w 10 dni. W ile dni tę samą pracę wykona 4 robotników, pracując w tym samym tempie?',o:['15','6,7','12','20'],a:'A',h:['Mniej robotników – więcej dni. To proporcjonalność odwrotna.'],s:'Praca to 6 · 10 = 60 „dniówek”. 60 : 4 = 15 dni.'},
{id:'e9',t:'rownania',type:'open',q:'Za 3 zeszyty i 2 długopisy zapłacono 19 zł, a za 2 takie zeszyty i 3 takie długopisy – 16 zł. Ile kosztuje jeden zeszyt, a ile jeden długopis? Zapisz obliczenia.',crit:['Ułożenie układu równań: 3z + 2d = 19 i 2z + 3d = 16 (lub inny poprawny sposób).','Doprowadzenie do równania z jedną niewiadomą (np. z + d = 7 i z − d = 3).','Wynik: zeszyt 5 zł, długopis 2 zł.'],h:['Dodaj równania stronami, a potem podziel przez 5.','Odejmij równania stronami.'],s:'Dodajemy: 5z + 5d = 35, więc z + d = 7. Odejmujemy: z − d = 3. Stąd 2z = 10, z = 5, d = 2. Zeszyt kosztuje 5 zł, długopis 2 zł.'},
{id:'e10',t:'rownania',type:'num',p:1,q:'Rozwiąż równanie: 0,5x − 1,5 = 2',a:7,h:['Dodaj 1,5 do obu stron, potem pomnóż przez 2.'],s:'0,5x = 3,5, więc x = 7.'},

// DANE
{id:'d1',t:'dane',type:'abcd',q:'Na diagramie przedstawiono oceny z klasówki z matematyki w klasie 8b. Ilu uczniów pisało klasówkę?',fig:gradeChart,o:['6','21','24','26'],a:'C',h:['Dodaj wysokości wszystkich słupków.'],s:'2 + 4 + 8 + 6 + 3 + 1 = 24.'},
{id:'d2',t:'dane',type:'abcd',q:'Diagram przedstawia oceny z klasówki w klasie 8b. Jaka część uczniów otrzymała ocenę co najmniej 4?',fig:gradeChart,o:[f(5,12),f(10,12),f(1,4),f(7,12)],a:'A',h:['„Co najmniej 4” to oceny 4, 5 i 6.','Wszystkich uczniów jest 24.'],s:`4, 5 lub 6 dostało 6 + 3 + 1 = 10 uczniów. ${f(10,24)} = ${f(5,12)}.`},
{id:'d3',t:'dane',type:'pf',q:'Diagram przedstawia oceny z klasówki w klasie 8b. Oceń prawdziwość zdań.',fig:gradeChart,st:['Średnia ocen z klasówki jest większa od 3.','Najczęściej występującą oceną jest 4.'],a:['P','F'],h:['Średnia = suma (ocena · liczba uczniów) : liczba uczniów.'],s:`Suma ocen: 1·2 + 2·4 + 3·8 + 4·6 + 5·3 + 6·1 = 79. Średnia: 79 : 24 ≈ 3,29 &gt; 3 – prawda. Najwyższy słupek ma ocena 3 – drugie zdanie jest fałszywe.`},
{id:'d4',t:'dane',type:'num',p:1,unit:'°C',q:'Wykres pokazuje temperaturę powietrza w ciągu dnia. Ile stopni wynosiła różnica między najwyższą a najniższą temperaturą?',fig:tempChart,a:10,h:['Odczytaj najwyższy i najniższy punkt wykresu.'],s:'Najwyższa: 12°C (godz. 14), najniższa: 2°C (godz. 6). Różnica: 10°C.'},
{id:'d5',t:'dane',type:'abcd',q:'Wykres pokazuje temperaturę powietrza w ciągu dnia. W którym przedziale czasu temperatura rosła najszybciej?',fig:tempChart,o:['6–8','8–10','10–12','12–14'],a:'C',h:['Policz, o ile wzrosła temperatura w każdym przedziale.'],s:'6–8: +2°C, 8–10: +3°C, 10–12: +4°C, 12–14: +1°C. Najszybciej w godzinach 10–12.'},
{id:'d6',t:'dane',type:'num',p:1,unit:'zł',q:'W tabeli podano ceny biletów komunikacji miejskiej. Pan Adam kupił 3 bilety jednorazowe normalne i 4 bilety jednorazowe ulgowe. Ile zapłacił?',fig:()=>ticketTable,a:22,h:['3 · 4,40 zł oraz 4 · 2,20 zł.'],s:'3 · 4,40 = 13,20 zł, 4 · 2,20 = 8,80 zł. Razem 22 zł.'},
{id:'d7',t:'dane',type:'abcd',q:'Diagram kołowy pokazuje, jak 200 uczniów szkoły dociera na lekcje. Ilu uczniów przychodzi pieszo?',fig:travelPie,o:['15','30','50','20'],a:'B',h:['15% z 200.'],s:'0,15 · 200 = 30 uczniów.'},
{id:'d8',t:'dane',type:'pf',q:'Diagram kołowy pokazuje, jak 200 uczniów szkoły dociera na lekcje. Oceń prawdziwość zdań.',fig:travelPie,st:['Rowerem dojeżdża dwa razy więcej uczniów niż autobusem.','Samochodem dojeżdża 10 uczniów.'],a:['P','F'],h:['10% to procent, a nie liczba uczniów.'],s:'Rower 50%, autobus 25% – dwa razy więcej, prawda. Samochodem: 10% z 200 = 20 uczniów, a nie 10 – fałsz.'},

// STATYSTYKA I PRAWDOPODOBIEŃSTWO
{id:'s1',t:'stat',type:'abcd',q:'Średnia arytmetyczna liczb 4, 7, 7, 10, 12 jest równa',o:['7','8','10','40'],a:'B',h:['Dodaj liczby i podziel przez to, ile ich jest.'],s:'(4 + 7 + 7 + 10 + 12) : 5 = 40 : 5 = 8.'},
{id:'s2',t:'stat',type:'abcd',q:'Mediana liczb 3, 9, 1, 7, 5, 8 jest równa',o:['5','6','7','5,5'],a:'B',h:['Najpierw ustaw liczby od najmniejszej do największej.','Przy parzystej liczbie danych mediana to średnia dwóch środkowych.'],s:'1, 3, 5, 7, 8, 9. Środkowe: 5 i 7. Mediana: (5 + 7) : 2 = 6.'},
{id:'s3',t:'stat',type:'abcd',q:'Rzucamy raz zwykłą kostką do gry. Prawdopodobieństwo wyrzucenia liczby pierwszej jest równe',o:[f(1,3),f(1,2),f(2,3),f(1,6)],a:'B',h:['Liczby pierwsze na kostce: 2, 3, 5. Pamiętaj, że 1 nie jest liczbą pierwszą.'],s:`Są 3 korzystne wyniki (2, 3, 5) na 6 możliwych: ${f(3,6)} = ${f(1,2)}.`},
{id:'s4',t:'stat',type:'num',p:1,q:`W pudełku są 3 kule czerwone, 5 niebieskich i kilka zielonych. Prawdopodobieństwo wylosowania kuli czerwonej jest równe ${f(1,4)}. Ile jest kul zielonych?`,a:4,h:[`Jeśli 3 kule to ${f(1,4)} wszystkich, to ile jest wszystkich kul?`],s:'Wszystkich kul jest 3 · 4 = 12. Zielonych: 12 − 3 − 5 = 4.'},
{id:'s5',t:'stat',type:'pf',q:'Losujemy jedną liczbę ze zbioru {1, 2, 3, …, 20}. Oceń prawdziwość zdań.',st:[`Prawdopodobieństwo wylosowania liczby podzielnej przez 5 jest równe ${f(1,5)}.`,`Prawdopodobieństwo wylosowania liczby większej od 15 jest równe ${f(1,4)}.`],a:['P','P'],h:['Wypisz liczby spełniające każdy warunek.'],s:`Podzielne przez 5: 5, 10, 15, 20 – to ${f(4,20)} = ${f(1,5)}, prawda. Większe od 15: 16, 17, 18, 19, 20 – to ${f(5,20)} = ${f(1,4)}, prawda.`},
{id:'s6',t:'stat',type:'abcd',q:'Ile różnych liczb dwucyfrowych można zapisać za pomocą cyfr 1, 2, 3, jeśli cyfry mogą się powtarzać?',o:['6','9','3','27'],a:'B',h:['Na miejscu dziesiątek – 3 możliwości, na miejscu jedności – też 3.'],s:'3 · 3 = 9 liczb: 11, 12, 13, 21, 22, 23, 31, 32, 33.'},
{id:'s7',t:'stat',type:'num',p:2,unit:'lat',q:'Średnia wieku pięciu osób wynosi 12 lat. Gdy dołączyła do nich szósta osoba, średnia wieku wzrosła do 13 lat. Ile lat ma szósta osoba?',a:18,h:['Suma wieku pięciu osób to 5 · 12.','Suma wieku sześciu osób to 6 · 13.'],s:'5 · 12 = 60, 6 · 13 = 78. Szósta osoba ma 78 − 60 = 18 lat.'},
{id:'s8',t:'stat',type:'abcd',q:'Na ile sposobów trzy osoby mogą ustawić się w kolejce?',o:['3','6','9','27'],a:'B',h:['Pierwsze miejsce może zająć 3 osoby, drugie 2, trzecie 1.'],s:'3 · 2 · 1 = 6.'},
{id:'s9',t:'stat',type:'match',q:'Rzucamy dwiema monetami. Prawdopodobieństwo wyrzucenia dwóch orłów jest równe ____, a prawdopodobieństwo wyrzucenia co najmniej jednego orła jest równe ____.',g:[[['A',f(1,4)],['B',f(1,2)]],[['1',f(1,2)],['2',f(3,4)],['3',f(1,4)]]],a:['A','2'],h:['Wypisz wszystkie wyniki: OO, OR, RO, RR.'],s:`Są 4 wyniki. Dwa orły: tylko OO – ${f(1,4)} (A). Co najmniej jeden orzeł: OO, OR, RO – ${f(3,4)} (2).`},

// KĄTY I TRÓJKĄTY
{id:'k1',t:'katy',type:'abcd',q:'Dwa kąty trójkąta mają miary 47° i 68°. Trzeci kąt ma miarę',o:['65°','75°','115°','55°'],a:'A',h:['Suma kątów w trójkącie wynosi 180°.'],s:'180° − 47° − 68° = 65°.'},
{id:'k2',t:'katy',type:'abcd',q:'Kąt przy podstawie trójkąta równoramiennego ma miarę 40°. Kąt między ramionami ma miarę',o:['40°','80°','100°','140°'],a:'C',h:['W trójkącie równoramiennym oba kąty przy podstawie są równe.'],s:'180° − 2 · 40° = 100°.'},
{id:'k3',t:'katy',type:'pf',q:'Oceń prawdziwość zdań.',st:['Suma miar kątów przyległych jest równa 180°.','Kąty wierzchołkowe mają różne miary.'],a:['P','F'],h:['Kąty wierzchołkowe powstają przy przecięciu dwóch prostych – leżą naprzeciw siebie.'],s:'Kąty przyległe tworzą kąt półpełny, czyli 180° – prawda. Kąty wierzchołkowe są zawsze równe – fałsz.'},
{id:'k4',t:'katy',type:'num',p:1,unit:'°',q:'W trójkącie ABC kąt przy wierzchołku A ma 55°. Kąt zewnętrzny przy wierzchołku C ma 130°. Jaką miarę ma kąt przy wierzchołku B?',a:75,h:['Kąt zewnętrzny trójkąta jest równy sumie dwóch kątów wewnętrznych do niego nieprzyległych.'],s:'130° = 55° + kąt B, więc kąt B = 75°.'},
{id:'k5',t:'katy',type:'abcd',q:'Suma miar kątów wewnętrznych sześciokąta jest równa',o:['540°','720°','900°','1080°'],a:'B',h:['Suma kątów n-kąta: (n − 2) · 180°.'],s:'(6 − 2) · 180° = 720°.'},
{id:'k6',t:'katy',type:'abcd',q:'Kąt wewnętrzny ośmiokąta foremnego ma miarę',o:['120°','135°','140°','150°'],a:'B',h:['Suma kątów ośmiokąta to (8 − 2) · 180°. W foremnym wszystkie kąty są równe.'],s:'6 · 180° = 1080°, 1080° : 8 = 135°.'},
{id:'k7',t:'katy',type:'abcd',q:'W trójkącie prostokątnym jeden kąt ostry jest 2 razy większy od drugiego. Większy kąt ostry ma miarę',o:['30°','45°','60°','90°'],a:'C',h:['Kąty ostre trójkąta prostokątnego sumują się do 90°.'],s:'x + 2x = 90°, x = 30°. Większy kąt: 60°.'},
{id:'k8',t:'katy',type:'match',q:'Trójkąt o kątach 30°, 60°, 90° jest ____. Trójkąt o bokach 5 cm, 5 cm i 8 cm jest ____.',g:[[['A','prostokątny'],['B','rozwartokątny']],[['1','równoboczny'],['2','równoramienny'],['3','różnoboczny']]],a:['A','2'],h:['Jeden z kątów to 90°. Dwa boki mają tę samą długość.'],s:'Kąt 90° – trójkąt prostokątny (A). Dwa równe boki – równoramienny (2).'},
{id:'k9',t:'katy',type:'pf',q:'Oceń prawdziwość zdań.',st:['Z odcinków o długościach 3 cm, 4 cm i 8 cm można zbudować trójkąt.','Z odcinków o długościach 5 cm, 6 cm i 10 cm można zbudować trójkąt.'],a:['F','P'],h:['Suma dwóch krótszych boków musi być większa od najdłuższego.'],s:'3 + 4 = 7 &lt; 8 – nie można, fałsz. 5 + 6 = 11 &gt; 10 – można, prawda.'},
{id:'k10',t:'katy',type:'open',q:'W równoległoboku kąt ostry jest o 50° mniejszy od kąta rozwartego. Oblicz miary kątów tego równoległoboku. Zapisz obliczenia.',crit:['Zapisanie zależności: suma sąsiednich kątów równoległoboku to 180° (np. x + x + 50° = 180°).','Poprawne miary: 65° i 115°.'],h:['Sąsiednie kąty równoległoboku sumują się do 180°.'],s:'x + (x + 50°) = 180° → 2x = 130° → x = 65°. Kąty mają 65° i 115° (po dwa takie kąty).'},

// PITAGORAS
{id:'t1',t:'pitagoras',type:'abcd',q:'Przyprostokątne trójkąta prostokątnego mają długości 6 i 8. Przeciwprostokątna ma długość',o:['10','14','7','100'],a:'A',h:['a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup>.'],s:`36 + 64 = 100, c = ${rt(100)} = 10.`},
{id:'t2',t:'pitagoras',type:'abcd',q:'Przeciwprostokątna trójkąta prostokątnego ma długość 13, a jedna z przyprostokątnych 5. Druga przyprostokątna ma długość',o:['8','12','18',rt(194)],a:'B',h:['b<sup>2</sup> = c<sup>2</sup> − a<sup>2</sup>.'],s:`169 − 25 = 144, b = ${rt(144)} = 12.`},
{id:'t3',t:'pitagoras',type:'abcd',q:'Przekątna kwadratu o boku 5 cm ma długość',o:['10 cm',`5${rt(2)} cm`,'25 cm',`2${rt(5)} cm`],a:'B',h:['Przekątna kwadratu o boku a ma długość a√2.'],s:`5<sup>2</sup> + 5<sup>2</sup> = 50, d = ${rt(50)} = 5${rt(2)} cm.`},
{id:'t4',t:'pitagoras',type:'pf',q:'Oceń prawdziwość zdań.',st:['Trójkąt o bokach 7, 24, 25 jest prostokątny.','Trójkąt o bokach 4, 5, 6 jest prostokątny.'],a:['P','F'],h:['Sprawdź, czy suma kwadratów dwóch krótszych boków równa się kwadratowi najdłuższego.'],s:'49 + 576 = 625 = 25<sup>2</sup> – prawda. 16 + 25 = 41 ≠ 36 – fałsz.'},
{id:'t5',t:'pitagoras',type:'abcd',q:'Wysokość trójkąta równobocznego o boku 6 ma długość',o:[`3${rt(3)}`,`6${rt(3)}`,`3${rt(2)}`,'3'],a:'A',h:['Wysokość dzieli trójkąt na dwa trójkąty prostokątne o przyprostokątnej 3 i przeciwprostokątnej 6.'],s:`h<sup>2</sup> = 36 − 9 = 27, h = ${rt(27)} = 3${rt(3)}.`},
{id:'t6',t:'pitagoras',type:'num',p:2,unit:'m',q:'Drabina o długości 5 m jest oparta o ścianę. Dolny koniec drabiny jest w odległości 1,4 m od ściany. Na jakiej wysokości drabina dotyka ściany?',a:4.8,h:['Drabina to przeciwprostokątna.','5<sup>2</sup> − 1,4<sup>2</sup> = 25 − 1,96.'],s:`h<sup>2</sup> = 25 − 1,96 = 23,04, h = ${rt('23,04')} = 4,8 m.`},
{id:'t7',t:'pitagoras',type:'abcd',q:'Odległość między punktami A = (1, 2) i B = (4, 6) jest równa',o:['5','7',rt(7),'25'],a:'A',h:['Różnica współrzędnych x to 3, różnica y to 4.'],s:`${rt('3² + 4²')} = ${rt(25)} = 5.`},
{id:'t8',t:'pitagoras',type:'open',q:'Przekątna prostokąta ma długość 17 cm, a jeden z jego boków 8 cm. Oblicz pole tego prostokąta. Zapisz obliczenia.',crit:['Zastosowanie twierdzenia Pitagorasa: 8<sup>2</sup> + b<sup>2</sup> = 17<sup>2</sup>.','Obliczenie drugiego boku: b = 15 cm.','Obliczenie pola: 120 cm<sup>2</sup>.'],h:['Przekątna dzieli prostokąt na dwa trójkąty prostokątne.'],s:'b<sup>2</sup> = 289 − 64 = 225, b = 15 cm. Pole: 8 · 15 = 120 cm<sup>2</sup>.'},
{id:'t9',t:'pitagoras',type:'abcd',q:'Przekątne rombu mają długości 6 i 8. Bok tego rombu ma długość',o:['5','7','10','14'],a:'A',h:['Przekątne rombu przecinają się pod kątem prostym i dzielą się na połowy.'],s:`Połowy przekątnych: 3 i 4. Bok: ${rt('9 + 16')} = 5.`},

// POLA
{id:'f1',t:'pola',type:'abcd',q:'Pole trójkąta o podstawie 10 cm i wysokości 7 cm jest równe',o:['70 cm²','35 cm²','17 cm²','34 cm²'],a:'B',h:[`P = ${f(1,2)} · a · h.`],s:`${f(1,2)} · 10 · 7 = 35 cm².`},
{id:'f2',t:'pola',type:'abcd',q:'Trapez ma podstawy długości 8 cm i 4 cm oraz wysokość 5 cm. Jego pole jest równe',o:['30 cm²','60 cm²','160 cm²','17 cm²'],a:'A',h:[`P = ${f('(a + b) · h',2)}.`],s:`${f('(8 + 4) · 5',2)} = ${f(60,2)} = 30 cm².`},
{id:'f3',t:'pola',type:'num',p:1,unit:'cm²',q:'Oblicz pole koła o promieniu 3 cm. Przyjmij π ≈ 3,14.',a:28.26,h:['P = πr<sup>2</sup>.'],s:'3,14 · 3<sup>2</sup> = 3,14 · 9 = 28,26 cm².'},
{id:'f4',t:'pola',type:'abcd',q:'Obwód koła o średnicy 10 cm jest równy',o:['10π cm','20π cm','25π cm','5π cm'],a:'A',h:['Obwód = 2πr = πd.'],s:'π · 10 = 10π cm.'},
{id:'f5',t:'pola',type:'pf',q:'Oceń prawdziwość zdań.',st:['Kwadrat o boku 4 cm ma pole 16 cm² i obwód 16 cm.','Jeśli bok kwadratu zwiększymy 2 razy, to jego pole zwiększy się 2 razy.'],a:['P','F'],h:['Sprawdź drugie zdanie: kwadrat o boku 1 i o boku 2.'],s:'4 · 4 = 16 cm², 4 · 4 = 16 cm – prawda. Bok 1 → pole 1, bok 2 → pole 4. Pole rośnie 4 razy – fałsz.'},
{id:'f6',t:'pola',type:'num',p:2,unit:'kg',q:`Działka ma kształt prostokąta o wymiarach 24 m × 15 m. ${f(1,3)} jej powierzchni zajmuje dom z podjazdem, a resztę obsiano trawą. 1 kg nasion wystarcza na 40 m². Ile kilogramów nasion zużyto?`,a:6,h:['Najpierw pole działki, potem 2/3 tego pola.'],s:`Pole: 24 · 15 = 360 m². Trawa: ${f(2,3)} · 360 = 240 m². Nasiona: 240 : 40 = 6 kg.`},
{id:'f7',t:'pola',type:'abcd',q:'Pole rombu o przekątnych 6 cm i 10 cm jest równe',o:['60 cm²','30 cm²','16 cm²','15 cm²'],a:'B',h:[`P = ${f('e · f',2)}.`],s:`${f('6 · 10',2)} = 30 cm².`},
{id:'f8',t:'pola',type:'open',q:'Z kwadratowej płytki o boku 10 cm wycięto koło o promieniu 2 cm (rysunek). Oblicz pole pozostałej części płytki. Przyjmij π ≈ 3,14. Zapisz obliczenia.',fig:squareHole,crit:['Obliczenie pola kwadratu: 100 cm².','Obliczenie pola koła: 4π ≈ 12,56 cm².','Wynik: 100 − 4π ≈ 87,44 cm².'],h:['Pole części = pole kwadratu − pole koła.'],s:'Kwadrat: 10 · 10 = 100 cm². Koło: π · 2<sup>2</sup> = 4π ≈ 12,56 cm². Zostaje: 100 − 12,56 = 87,44 cm².'},
{id:'f9',t:'pola',type:'abcd',q:'Prostokąt ma pole 48 cm², a jeden z jego boków ma 6 cm. Obwód tego prostokąta jest równy',o:['14 cm','28 cm','48 cm','24 cm'],a:'B',h:['Drugi bok = 48 : 6.'],s:'Drugi bok: 8 cm. Obwód: 2 · (6 + 8) = 28 cm.'},

// UKŁAD WSPÓŁRZĘDNYCH
{id:'u1',t:'uklad',type:'abcd',q:'Punkt symetryczny do punktu (3, −2) względem osi x ma współrzędne',o:['(3, 2)','(−3, −2)','(−3, 2)','(2, 3)'],a:'A',h:['Przy symetrii względem osi x zmienia się znak tylko drugiej współrzędnej.'],s:'(3, −2) → (3, 2).'},

{id:'w10',t:'wyrazenia',type:'abcd',q:'Iloczyn (x − 3)(x + 2) jest równy',o:['x<sup>2</sup> + x − 6','x<sup>2</sup> − 6','x<sup>2</sup> − x − 6','x<sup>2</sup> − 5x − 6'],a:'C',h:['Pomnóż każdy wyraz pierwszego nawiasu przez każdy wyraz drugiego.'],s:'x · x + 2x − 3x − 6 = x<sup>2</sup> − x − 6.'},
{id:'w11',t:'wyrazenia',type:'abcd',q:'Wyrażenie 2(a + b) − 2(a − b) po uproszczeniu to',o:['0','4a','4b','4a + 4b'],a:'C',h:['−2(a − b) = −2a + 2b.'],s:'2a + 2b − 2a + 2b = 4b.'},
{id:'w12',t:'wyrazenia',type:'pf',q:'Oceń prawdziwość zdań.',st:['Dla x = −1 wartość wyrażenia x<sup>2</sup> + x jest równa 0.','Wyrażenie 3x − x jest równe 3.'],a:['P','F'],h:['(−1)<sup>2</sup> = 1.'],s:'1 + (−1) = 0 – prawda. 3x − x = 2x, a nie 3 – fałsz.'},
{id:'w13',t:'wyrazenia',type:'num',p:1,q:`Oblicz wartość wyrażenia 4a − 2b dla a = ${f(1,2)} i b = −3.`,a:8,h:['Odejmowanie liczby ujemnej to dodawanie.'],s:`4 · ${f(1,2)} = 2, 2 · (−3) = −6. 2 − (−6) = 8.`},
{id:'w14',t:'wyrazenia',type:'abcd',q:'Bilet do kina kosztuje b zł, a popcorn p zł. Do kina idą 4 osoby, każda kupuje bilet, a popcorn kupują tylko 2 z nich. Ile zapłacą razem?',o:['4(b + p)','4b + 2p','6bp','2b + 4p'],a:'B',h:['4 bilety i 2 popcorny.'],s:'4 · b + 2 · p = 4b + 2p.'},
{id:'w15',t:'wyrazenia',type:'abcd',q:'Wyrażenie 6x + 9 można zapisać w postaci',o:['3(2x + 9)','6(x + 3)','9(x + 1)','3(2x + 3)'],a:'D',h:['Jaki jest największy wspólny dzielnik 6 i 9?'],s:'6x + 9 = 3 · 2x + 3 · 3 = 3(2x + 3).'},
{id:'w16',t:'wyrazenia',type:'match',q:'Pole kwadratu o boku 3a jest równe ____, a obwód tego kwadratu jest równy ____.',g:[[['A','9a<sup>2</sup>'],['B','3a<sup>2</sup>']],[['1','12a'],['2','6a'],['3','9a']]],a:['A','1'],h:['(3a)<sup>2</sup> = 3a · 3a.'],s:'(3a)<sup>2</sup> = 9a<sup>2</sup> (A). 4 · 3a = 12a (1).'},
{id:'w17',t:'wyrazenia',type:'open',q:'Wykaż, że suma trzech kolejnych liczb naturalnych jest podzielna przez 3.',crit:['Zapisanie sumy: n + (n + 1) + (n + 2) = 3n + 3.','Zapisanie 3n + 3 = 3(n + 1) i wniosek, że suma jest podzielna przez 3.'],h:['Oznacz najmniejszą liczbę przez n.','Wyłącz 3 przed nawias.'],s:'Niech liczby to n, n + 1, n + 2. Suma: 3n + 3 = 3(n + 1). Jest to iloczyn liczby 3 i liczby naturalnej, więc suma dzieli się przez 3.'},
{id:'w18',t:'wyrazenia',type:'abcd',q:'Uczeń ma x lat. Jego tata jest od niego 3 razy starszy. Ile lat będą mieli razem za 5 lat?',o:['4x + 5','4x + 10','3x + 10','4x'],a:'B',h:['Za 5 lat każdy z nich będzie starszy o 5 lat.'],s:'Teraz: x + 3x = 4x. Za 5 lat: (x + 5) + (3x + 5) = 4x + 10.'},

// RÓWNANIA
{id:'e11',t:'rownania',type:'abcd',q:`Rozwiązaniem równania ${f('x',3)} − 2 = 4 jest liczba`,o:['2','6','18','−6'],a:'C',h:['Dodaj 2 do obu stron, potem pomnóż przez 3.'],s:`${f('x',3)} = 6, więc x = 18.`},
{id:'e12',t:'rownania',type:'abcd',q:'Rozwiązaniem równania 5 − 2x = x + 11 jest liczba',o:['2','−2',f(16,3),'−6'],a:'B',h:['Przenieś x na jedną stronę, liczby na drugą.'],s:'5 − 11 = x + 2x → −6 = 3x → x = −2.'},
{id:'e13',t:'rownania',type:'pf',q:'Oceń prawdziwość zdań.',st:['Równanie 3(x − 1) = 3x − 3 ma nieskończenie wiele rozwiązań.','Liczba −1 jest rozwiązaniem równania x<sup>2</sup> = −1.'],a:['P','F'],h:['Opuść nawias w pierwszym równaniu. Czy kwadrat liczby może być ujemny?'],s:'3x − 3 = 3x − 3 jest prawdziwe dla każdego x – prawda. (−1)<sup>2</sup> = 1, a nie −1 – fałsz.'},
{id:'e14',t:'rownania',type:'num',p:1,unit:'km',q:'Mapa jest wykonana w skali 1 : 50 000. Odcinek na mapie ma długość 6 cm. Ile kilometrów ma ten odcinek w terenie?',a:3,h:['1 cm na mapie to 50 000 cm w terenie, czyli 500 m.'],s:'6 · 50 000 = 300 000 cm = 3000 m = 3 km.'},
{id:'e15',t:'rownania',type:'abcd',q:`Ze wzoru na pole trapezu P = ${f('(a + b) · h',2)} wyznaczono h. Otrzymano`,o:[f('P','2(a + b)'),f('2P','a + b'),'2P(a + b)',f('a + b','2P')],a:'B',h:['Pomnóż obie strony przez 2, a potem podziel przez (a + b).'],s:`2P = (a + b) · h, więc h = ${f('2P','a + b')}.`},
{id:'e16',t:'rownania',type:'num',p:2,unit:'lat',q:'Ojciec ma 40 lat, a syn 12 lat. Za ile lat ojciec będzie dwa razy starszy od syna?',a:16,h:['Za x lat: ojciec ma 40 + x, syn 12 + x.','Ułóż równanie 40 + x = 2(12 + x).'],s:'40 + x = 24 + 2x → x = 16. Sprawdzenie: ojciec 56, syn 28.'},
{id:'e17',t:'rownania',type:'abcd',q:'Rozwiązaniem układu równań 2x + y = 7 i x − y = 2 jest para',o:['x = 1, y = 3','x = 3, y = 1','x = 2, y = 3','x = 3, y = −1'],a:'B',h:['Dodaj równania stronami.'],s:'3x = 9, więc x = 3. Z drugiego równania y = x − 2 = 1.'},
{id:'e18',t:'rownania',type:'open',q:'Za 2 kg jabłek i 3 kg gruszek zapłacono 21 zł. Kilogram gruszek jest o 2 zł droższy od kilograma jabłek. Ile kosztuje kilogram jabłek, a ile kilogram gruszek? Zapisz obliczenia.',crit:['Ułożenie równania, np. 2j + 3(j + 2) = 21 (lub układu równań).','Obliczenie ceny jabłek: 3 zł za kg.','Obliczenie ceny gruszek: 5 zł za kg.'],h:['Oznacz cenę jabłek przez j. Wtedy gruszki kosztują j + 2.'],s:'2j + 3(j + 2) = 21 → 5j + 6 = 21 → j = 3. Gruszki: 3 + 2 = 5. Jabłka 3 zł/kg, gruszki 5 zł/kg.'},

// DANE
{id:'d9',t:'dane',type:'abcd',q:'Diagram pokazuje, ile książek przeczytali w wakacje uczniowie klasy 8a. Ilu uczniów przeczytało co najmniej 2 książki?',fig:booksChart,o:['6','15','18','10'],a:'B',h:['„Co najmniej 2” to 2, 3 lub 4 książki.'],s:'6 + 5 + 4 = 15 uczniów.'},
{id:'d10',t:'dane',type:'num',p:1,q:'Diagram pokazuje, ile książek przeczytali w wakacje uczniowie klasy 8a. Ile książek przeczytali wszyscy uczniowie razem?',fig:booksChart,a:50,h:['Pomnóż liczbę książek przez liczbę uczniów dla każdego słupka i dodaj.'],s:'0 · 3 + 1 · 7 + 2 · 6 + 3 · 5 + 4 · 4 = 0 + 7 + 12 + 15 + 16 = 50.'},
{id:'d11',t:'dane',type:'pf',q:'Diagram pokazuje, ile książek przeczytali w wakacje uczniowie klasy 8a. Oceń prawdziwość zdań.',fig:booksChart,st:['Mediana liczby przeczytanych książek jest równa 2.','Średnia liczba przeczytanych książek jest większa od mediany.'],a:['P','F'],h:['Uczniów jest 25, więc mediana to wynik 13. ucznia w kolejności.','Wszystkich książek jest 50.'],s:'Po uporządkowaniu: miejsca 1–3 to 0, 4–10 to 1, 11–16 to 2. 13. wynik to 2 – prawda. Średnia: 50 : 25 = 2, czyli jest równa medianie, a nie większa – fałsz.'},
{id:'d12',t:'dane',type:'abcd',q:'Wykres pokazuje odległość rowerzysty od domu w czasie wycieczki. Jak długo rowerzysta odpoczywał (stał w miejscu)?',fig:bikeChart,o:['0,5 h','1 h','2 h','3 h'],a:'B',h:['Gdy odległość się nie zmienia, wykres jest poziomy.'],s:'Od 1. do 2. godziny odległość była stała (8 km), więc odpoczywał 1 h.'},
{id:'d13',t:'dane',type:'num',p:1,unit:'km/h',q:'Wykres pokazuje odległość rowerzysty od domu w czasie wycieczki. Z jaką prędkością rowerzysta wracał do domu w ostatniej godzinie?',fig:bikeChart,a:14,h:['W ostatniej godzinie odległość zmalała z 14 km do 0 km.'],s:'W ciągu 1 h przejechał 14 km, więc jechał z prędkością 14 km/h.'},
{id:'d14',t:'dane',type:'abcd',q:'W tabeli podano wyniki skoku w dal pięciu uczennic. Średni wynik tych uczennic to',fig:()=>jumpTable,o:['3,50 m','3,62 m','3,45 m','3,51 m'],a:'A',h:['Dodaj wszystkie wyniki i podziel przez 5.'],s:'3,45 + 3,62 + 3,40 + 3,62 + 3,41 = 17,50. 17,50 : 5 = 3,50 m.'},
{id:'d15',t:'dane',type:'pf',q:'W tabeli podano wyniki skoku w dal pięciu uczennic. Oceń prawdziwość zdań.',fig:()=>jumpTable,st:['Najczęściej powtarzającym się wynikiem jest 3,62 m.','Różnica między najlepszym a najsłabszym wynikiem wynosi 0,12 m.'],a:['P','F'],h:['Najlepszy wynik to 3,62 m, najsłabszy 3,40 m.'],s:'3,62 m pojawia się dwa razy – prawda. 3,62 − 3,40 = 0,22 m, a nie 0,12 m – fałsz.'},
{id:'d16',t:'dane',type:'abcd',q:'Diagram pokazuje, ile książek przeczytali w wakacje uczniowie klasy 8a. Jaki procent uczniów nie przeczytał żadnej książki?',fig:booksChart,o:['3%','12%','25%','30%'],a:'B',h:['Uczniów jest 25. Jaką częścią 25 jest 3?'],s:`${f(3,25)} = ${f(12,100)} = 12%.`},

// STATYSTYKA
{id:'s10',t:'stat',type:'abcd',q:'Średnia arytmetyczna liczb 2, x, 8 jest równa 6. Liczba x to',o:['6','8','10','4'],a:'B',h:['Suma trzech liczb to 3 · 6.'],s:'2 + x + 8 = 18, więc x = 8.'},
{id:'s11',t:'stat',type:'abcd',q:'Losujemy jedną literę ze słowa MATEMATYKA. Prawdopodobieństwo wylosowania litery A jest równe',o:[f(1,10),f(1,3),f(3,10),f(3,7)],a:'C',h:['Policz wszystkie litery (z powtórzeniami) i litery A.'],s:`Słowo ma 10 liter, w tym 3 litery A. ${f(3,10)}.`},
{id:'s12',t:'stat',type:'num',p:1,q:'Średnia arytmetyczna liczb 3, 5, 8 i x jest równa 6. Oblicz x.',a:8,h:['Suma czterech liczb to 4 · 6 = 24.'],s:'3 + 5 + 8 + x = 24 → x = 8.'},
{id:'s13',t:'stat',type:'pf',q:'Rzucamy dwiema zwykłymi kostkami do gry. Oceń prawdziwość zdań.',st:[`Prawdopodobieństwo, że suma oczek wyniesie 12, jest równe ${f(1,36)}.`,`Prawdopodobieństwo, że suma oczek wyniesie 7, jest równe ${f(1,12)}.`],a:['P','F'],h:['Wszystkich wyników jest 6 · 6 = 36.','Sumę 7 dają pary: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1).'],s:`Suma 12 tylko dla (6,6): ${f(1,36)} – prawda. Suma 7: 6 par, ${f(6,36)} = ${f(1,6)} – fałsz.`},
{id:'s14',t:'stat',type:'abcd',q:'Ile jest liczb trzycyfrowych o różnych cyfrach, które można zapisać za pomocą cyfr 1, 2, 3, 4?',o:['12','24','64','4'],a:'B',h:['Pierwsza cyfra: 4 możliwości, druga: 3, trzecia: 2.'],s:'4 · 3 · 2 = 24.'},
{id:'s15',t:'stat',type:'num',p:2,q:`W pudełku jest 20 kul, białych i czarnych. Prawdopodobieństwo wylosowania kuli białej wynosi ${f(3,5)}. Ile kul czarnych trzeba dołożyć, aby prawdopodobieństwo wylosowania kuli białej było równe ${f(1,2)}?`,a:4,h:[`Kul białych jest ${f(3,5)} · 20 = 12.`,'Białe mają być połową wszystkich kul.'],s:'Białych: 12, czarnych: 8. Aby białe były połową, kul musi być 24, czyli trzeba dołożyć 4 czarne.'},
{id:'s16',t:'stat',type:'match',q:'Mediana liczb 4, 1, 6, 3 jest równa ____, a ich średnia arytmetyczna jest równa ____.',g:[[['A','3,5'],['B','5']],[['1','3,5'],['2','4'],['3','3']]],a:['A','1'],h:['Uporządkuj: 1, 3, 4, 6.'],s:'Mediana: (3 + 4) : 2 = 3,5 (A). Średnia: 14 : 4 = 3,5 (1).'},
{id:'s17',t:'stat',type:'abcd',q:'Pięć osób wita się, każda z każdą, jednym uściskiem dłoni. Ile było uścisków dłoni?',o:['20','25','10','5'],a:'C',h:['Każda osoba wita się z 4 innymi, ale każdy uścisk liczymy wtedy dwa razy.'],s:'5 · 4 : 2 = 10.'},
{id:'s18',t:'stat',type:'abcd',q:'Losujemy liczbę ze zbioru {1, 2, …, 30}. Prawdopodobieństwo wylosowania liczby podzielnej przez 3 lub przez 5 jest równe',o:[f(8,15),f(1,2),f(7,15),f(1,3)],a:'C',h:['Podzielnych przez 3: 10, przez 5: 6, przez 15 (liczone dwa razy): 2.'],s:`10 + 6 − 2 = 14 liczb. ${f(14,30)} = ${f(7,15)}.`},

// KĄTY
{id:'k11',t:'katy',type:'abcd',q:'Kąt α jest 4 razy większy od kąta do niego przyległego. Kąt α ma miarę',o:['36°','45°','144°','135°'],a:'C',h:['Kąty przyległe sumują się do 180°.'],s:'x + 4x = 180°, x = 36°. α = 4 · 36° = 144°.'},
{id:'k12',t:'katy',type:'abcd',q:'W trójkącie równoramiennym kąt między ramionami ma 50°. Kąt przy podstawie ma miarę',o:['50°','65°','130°','75°'],a:'B',h:['Dwa kąty przy podstawie są równe i razem mają 180° − 50°.'],s:'(180° − 50°) : 2 = 65°.'},
{id:'k13',t:'katy',type:'pf',q:'Oceń prawdziwość zdań.',st:['Każdy trójkąt równoboczny jest równoramienny.','Trójkąt może mieć dwa kąty rozwarte.'],a:['P','F'],h:['Kąt rozwarty ma więcej niż 90°. Ile miałyby dwa takie kąty?'],s:'Trójkąt równoboczny ma co najmniej dwa równe boki – prawda. Dwa kąty rozwarte to razem ponad 180° – fałsz.'},
{id:'k14',t:'katy',type:'num',p:1,unit:'°',q:'Dwie proste przecinają się, tworząc cztery kąty. Jeden z nich ma 38°. Jaką miarę ma największy z tych kątów?',a:142,h:['Kąt przyległy do kąta 38° ma 180° − 38°.'],s:'Kąty mają 38°, 142°, 38°, 142°. Największy: 142°.'},
{id:'k15',t:'katy',type:'abcd',q:'Ile przekątnych ma pięciokąt?',o:['10','5','3','6'],a:'B',h:['Z każdego wierzchołka wychodzą 2 przekątne, ale każdą liczymy wtedy dwa razy.'],s:'5 · 2 : 2 = 5.'},
{id:'k16',t:'katy',type:'abcd',q:'Zegar wskazuje godzinę 4:00. Kąt między wskazówkami ma miarę',o:['30°','60°','90°','120°'],a:'D',h:['Między sąsiednimi liczbami na tarczy jest 360° : 12 = 30°.'],s:'Między 12 a 4 są 4 odstępy po 30°: 120°.'},
{id:'k17',t:'katy',type:'match',q:'Kąty trójkąta mają miary α, 2α i 3α. Kąt α ma miarę ____, a ten trójkąt jest ____.',g:[[['A','30°'],['B','36°']],[['1','ostrokątny'],['2','prostokątny'],['3','rozwartokątny']]],a:['A','2'],h:['α + 2α + 3α = 180°.'],s:'6α = 180°, α = 30° (A). Kąty: 30°, 60°, 90° – trójkąt prostokątny (2).'},
{id:'k18',t:'katy',type:'open',q:'W trójkącie ABC kąt przy wierzchołku A ma 40°, a kąt przy wierzchołku B jest o 20° większy od kąta przy wierzchołku C. Oblicz miary kątów B i C. Zapisz obliczenia.',crit:['Ułożenie równania, np. 40° + (x + 20°) + x = 180°.','Wynik: kąt C = 60°, kąt B = 80°.'],h:['Oznacz kąt C przez x.'],s:'40° + x + 20° + x = 180° → 2x = 120° → x = 60°. Kąt C = 60°, kąt B = 80°.'},

// PITAGORAS
{id:'t10',t:'pitagoras',type:'abcd',q:`Przekątna kwadratu ma długość 6${rt(2)}. Bok tego kwadratu ma długość`,o:['3','6',`6${rt(2)}`,'12'],a:'B',h:['Przekątna kwadratu o boku a to a√2.'],s:`a${rt(2)} = 6${rt(2)}, więc a = 6.`},
{id:'t11',t:'pitagoras',type:'abcd',q:'Trójkąt prostokątny równoramienny ma przyprostokątne długości 4. Jego przeciwprostokątna ma długość',o:['8',`2${rt(2)}`,'16',`4${rt(2)}`],a:'D',h:['4<sup>2</sup> + 4<sup>2</sup> = 32.'],s:`c = ${rt(32)} = ${rt('16 · 2')} = 4${rt(2)}.`},
{id:'t12',t:'pitagoras',type:'pf',q:'Oceń prawdziwość zdań.',st:['Trójkąt o bokach 6, 8, 10 jest prostokątny.','Trójkąt o bokach 2, 3, 4 jest prostokątny.'],a:['P','F'],h:['Porównaj sumę kwadratów krótszych boków z kwadratem najdłuższego.'],s:'36 + 64 = 100 = 10<sup>2</sup> – prawda. 4 + 9 = 13 ≠ 16 – fałsz.'},
{id:'t13',t:'pitagoras',type:'num',p:1,q:'Prostokąt ma boki długości 9 i 12. Oblicz długość jego przekątnej.',a:15,h:['Przekątna jest przeciwprostokątną trójkąta o przyprostokątnych 9 i 12.'],s:`81 + 144 = 225, d = ${rt(225)} = 15.`},
{id:'t14',t:'pitagoras',type:'abcd',q:'Trójkąt równoramienny ma podstawę długości 10 i ramiona długości 13. Wysokość opuszczona na podstawę ma długość',o:['8',rt(69),'12','13'],a:'C',h:['Wysokość dzieli podstawę na pół: powstaje trójkąt prostokątny o bokach 5, h, 13.'],s:`h<sup>2</sup> = 169 − 25 = 144, h = 12.`},
{id:'t15',t:'pitagoras',type:'num',p:2,unit:'cm²',q:'Trójkąt równoramienny ma podstawę długości 16 cm i ramiona długości 10 cm. Oblicz pole tego trójkąta.',a:48,h:['Połowa podstawy to 8 cm. Oblicz wysokość z twierdzenia Pitagorasa.'],s:`h<sup>2</sup> = 100 − 64 = 36, h = 6 cm. P = ${f(1,2)} · 16 · 6 = 48 cm².`},
{id:'t16',t:'pitagoras',type:'open',q:'Kwadrat ABCD ma bok długości 8 cm. Punkt E jest środkiem boku BC. Oblicz obwód trójkąta ABE. Zapisz obliczenia.',crit:[`Zastosowanie twierdzenia Pitagorasa do trójkąta ABE: AE<sup>2</sup> = 8<sup>2</sup> + 4<sup>2</sup> = 80.`,`Obliczenie AE = ${rt(80)} = 4${rt(5)} cm.`,`Wynik: obwód = 12 + 4${rt(5)} cm.`],h:['Trójkąt ABE jest prostokątny, kąt prosty jest przy wierzchołku B.','BE to połowa boku kwadratu.'],s:`AB = 8 cm, BE = 4 cm. AE<sup>2</sup> = 64 + 16 = 80, AE = 4${rt(5)} cm. Obwód: 8 + 4 + 4${rt(5)} = 12 + 4${rt(5)} cm.`},
{id:'t17',t:'pitagoras',type:'abcd',q:'Telewizor ma ekran w kształcie prostokąta o wymiarach 48 cm × 36 cm. Przekątna ekranu ma długość',o:['84 cm','60 cm','42 cm','72 cm'],a:'B',h:['48 = 4 · 12 i 36 = 3 · 12. Przypomnij sobie trójkąt 3, 4, 5.'],s:`48<sup>2</sup> + 36<sup>2</sup> = 2304 + 1296 = 3600, d = ${rt(3600)} = 60 cm.`},

// POLA

// normalize tasks into "parts"
const L4=['A','B','C','D'];
// fixed per-task shuffle of A–D options, so the correct letter is spread evenly but stays the same for each task
function permFor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;const p=[0,1,2,3];for(let i=3;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[p[i],p[j]]=[p[j],p[i]]}return p}
BANK.forEach(t=>{
  if(t.type==='abcd'){const p=permFor(t.id),orig=L4.indexOf(t.a);t.parts=[{opts:p.map((src,i)=>({k:L4[i],t:t.o[src]})),ans:L4[p.indexOf(orig)]}];t.p=1}
  if(t.type==='pf'){t.parts=t.st.map((x,i)=>({stmt:x,opts:[{k:'P',t:'P'},{k:'F',t:'F'}],ans:t.a[i]}));t.p=1}
  if(t.type==='match'){t.parts=t.g.map((grp,i)=>({opts:grp.map(([k,x])=>({k,t:x})),ans:t.a[i]}));t.p=1}
  if(t.type==='open')t.p=t.crit.length;
  t.closed=!!t.parts;
});
const BY=Object.fromEntries(BANK.map(t=>[t.id,t]));

// ---------- helpers ----------
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pl=n=>n===1?'punkt':(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'punkty':'punktów';
const fmt=n=>String(n).replace('.',',');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseNum(s){
  if(s==null)return NaN;
  s=String(s).trim().toLowerCase().replace(/−|–/g,'-').replace(/,/g,'.');
  s=s.replace(/\s*(cm³|cm²|cm|m³|m²|m|km\/h|km|zł|lat|kg|min|h|l|°c|°|%)$/,'').trim();
  let m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/);
  if(m)return (m[1]?-1:1)*(+m[2]+ +m[3]/ +m[4]);
  m=s.match(/^(-?\d*\.?\d+)\s*\/\s*(\d*\.?\d+)$/);
  if(m)return +m[1]/ +m[2];
  s=s.replace(/\s/g,'');
  return s===''?NaN:Number(s);
}
const numOk=(t,v)=>{const x=parseNum(v);return !isNaN(x)&&Math.abs(x-t.a)<1e-6};
const choiceOk=(t,sel)=>t.parts.every((p,i)=>sel&&sel[i]===p.ans);
const ansText=t=>t.closed?t.parts.map(p=>p.ans).join(', '):t.type==='num'?fmt(t.a)+(t.unit?' '+t.unit:''):'';
const figHTML=t=>t.fig?`<div class="fig-wrap">${t.fig()}</div>`:'';

function optBtn(i,o,sel,reveal,t,compact){
  let c='opt';
  if(sel&&sel[i]===o.k)c+=' sel';
  if(reveal){if(o.k===t.parts[i].ans)c+=' right';else if(sel&&sel[i]===o.k)c+=' wrong'}
  return `<button type="button" class="${c}" data-p="${i}" data-k="${o.k}" ${reveal?'disabled':''} aria-pressed="${sel&&sel[i]===o.k}"><span class="k">${o.k}</span>${compact?'':`<span class="t">${o.t}</span>`}</button>`;
}
function answerHTML(t,ans,reveal,key){
  if(t.type==='abcd')return `<div class="opts">${t.parts[0].opts.map(o=>optBtn(0,o,ans,reveal,t)).join('')}</div>`;
  if(t.type==='pf')return `<p class="instr">Wybierz P, jeśli zdanie jest prawdziwe, albo F – jeśli jest fałszywe.</p><div class="pf">${t.parts.map((p,i)=>`<div class="pf-row"><div class="pf-s">${p.stmt}</div><div class="pf-b">${p.opts.map(o=>optBtn(i,o,ans,reveal,t,true)).join('')}</div></div>`).join('')}</div>`;
  if(t.type==='match')return `<p class="instr">Wybierz odpowiedź spośród ${t.parts[0].opts.map(o=>o.k).join(' i ')} oraz odpowiedź spośród ${t.parts[1].opts.map(o=>o.k).join(', ')}.</p>${t.parts.map((p,i)=>`<div class="grp"><div class="eyebrow">Luka ${i+1}</div><div class="opts">${p.opts.map(o=>optBtn(i,o,ans,reveal,t)).join('')}</div></div>`).join('')}`;
  if(t.type==='num'){const st=reveal?(numOk(t,ans)?' ok':' bad'):'';
    return `<label class="numin${st}"><span class="muted">Odpowiedź:</span><input id="in-${key}" data-in="${t.id}" inputmode="decimal" autocomplete="off" value="${esc(ans||'')}" ${reveal?'readonly':''} placeholder="np. 12,5">${t.unit?`<span>${t.unit}</span>`:''}</label>`}
  if(t.type==='open')return `<label class="stack" style="gap:6px"><span class="instr">Rozwiąż zadanie na kartce lub zapisz tu najważniejsze obliczenia i odpowiedź.</span><textarea id="tx-${key}" data-in="${t.id}" ${reveal?'readonly':''}>${esc(ans||'')}</textarea></label>`;
}
function taskHTML(t,ans,reveal,label,key){
  return `<article class="task"><div class="task-h"><span class="num">${label}</span><span class="row" style="gap:8px"><span class="tag">${TNAME[t.t]}</span><span class="pts">${t.p} pkt</span></span></div>
  <div class="q">${t.q}</div>${figHTML(t)}${answerHTML(t,ans,reveal,key)}</article>`;
}
function critHTML(t,checked,group){
  return `<ul class="crit">${t.crit.map((c,i)=>`<li><label><input type="checkbox" id="cr-${group}-${i}" data-crit="${i}" ${checked&&checked[i]?'checked':''}><span>${c} <b class="muted">(1 pkt)</b></span></label></li>`).join('')}</ul>`;
}
function topicStats(id){const ts=BANK.filter(t=>t.t===id);let ok=0,bad=0;ts.forEach(t=>{if(S.res[t.id]==='ok')ok++;else if(S.res[t.id]==='bad')bad++});return{n:ts.length,ok,bad}}
const reviewIds=()=>BANK.filter(t=>S.res[t.id]==='bad').map(t=>t.id);

  <div class="modes">

    <button class="mode" type="button" data-go="exam"><span class="eyebrow">Tryb 2</span><h2>Egzamin próbny</h2><p class="muted">Losowy arkusz: 15 zadań zamkniętych i zadania otwarte, razem 30 punktów. Odliczanie 125 minut.</p>${S.hist.length?`<p class="hist">Ostatnie wyniki: ${S.hist.slice(-4).map(h=>h.score+'/30').join(' · ')}</p>`:''}<span class="go">${inProg?'Wróć do rozpoczętego egzaminu →':'Rozpocznij egzamin →'}</span></button>
  </div>
  <section class="stack" style="gap:10px"><h2>Oficjalne materiały CKE</h2><p class="muted">Kolejność, w jakiej warto z nich korzystać. Linki otwierają się w nowej karcie.</p>
  <ol class="links">
    <li><span class="n">1</span><div><a href="https://zspptaszkowa.gminagrybow.pl/files/53/informator-matematyka.pdf" target="_blank" rel="noopener">Informator o egzaminie z matematyki (PDF)</a><p class="muted">Opis arkusza, zasady oceniania, przykładowe zadania z rozwiązaniami. Obowiązuje od roku 2024/2025. <a href="https://cke.gov.pl/egzamin-osmoklasisty/informatory/" target="_blank" rel="noopener">Strona CKE z informatorami</a>.</p></div></li>
    <li><span class="n">2</span><div><a href="https://cke.gov.pl/egzamin-osmoklasisty/arkusze/" target="_blank" rel="noopener">Arkusze z poprzednich lat</a><p class="muted">Najlepszy trening. Zacznij od 2026, potem 2025 i 2024. Przykład: <a href="https://fhbkobuhipsjzpbdsmpu.supabase.co/storage/v1/object/public/cke-archive/egzamin-osmoklasisty/matematyka/2026-czerwiec-dodatkowy-egzamin-osmoklasisty/arkusz.pdf" target="_blank" rel="noopener">arkusz z czerwca 2026 (termin dodatkowy)</a>.</p></div></li>
    <li><span class="n">3</span><div><a href="https://www.cke.gov.pl/egzamin-osmoklasisty/materialy-dodatkowe/zestawy-zadan-powtorkowych/" target="_blank" rel="noopener">Zestawy zadań powtórkowych</a><p class="muted">Ułożone według wymagań z klas 7–8. Dobre do ćwiczenia słabszych działów.</p></div></li>
    <li><span class="n">4</span><div><a href="https://www.gov.pl/web/edukacja/arkusze-do-egzaminu-probnego-dla-osmoklasisty--matematyka" target="_blank" rel="noopener">Arkusze próbne z zasadami oceniania (gov.pl)</a></div></li>
  </ol></section></div>`;
}

// ---------- TOPICS ----------
function vTopics(){
  const rev=reviewIds();
  app.innerHTML=`<div class="stack"><div class="row" style="justify-content:space-between"><div class="stack" style="gap:4px"><h1>Ćwiczenia</h1><p class="muted">Wybierz dział. Zielony pasek – zadania rozwiązane dobrze, czerwony – do poprawy.</p></div>
  ${rev.length?`<button class="btn" type="button" id="rev">Do powtórki (${rev.length})</button>`:''}</div>
  <div class="topics">${TOPICS.map(([id,name])=>{const s=topicStats(id);return `<button class="topic" type="button" data-topic="${id}"><h3>${name}</h3><div class="bar"><i style="width:${s.ok/s.n*100}%"></i><i class="b" style="width:${s.bad/s.n*100}%"></i></div><div class="meta"><span>${s.n} zadań</span><span>${s.ok}/${s.n} ✓</span></div></button>`}).join('')}</div>
  <button class="btn quiet" type="button" id="reset" style="align-self:flex-start">Wyczyść postęp ćwiczeń</button></div>`;
  app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>startDrill(BANK.filter(t=>t.t===b.dataset.topic).map(t=>t.id),TNAME[b.dataset.topic]));
  const r=document.getElementById('rev');if(r)r.onclick=()=>startDrill(rev,'Do powtórki');
  const rs=document.getElementById('reset');let armed=false;
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Na pewno? Kliknij jeszcze raz';rs.classList.add('danger');return}S.res={};save();vTopics()};
}

// ---------- DRILL ----------
let D=null;
function startDrill(ids,title){
  const first=ids.findIndex(id=>S.res[id]!=='ok');
  D={ids,title,i:first<0?0:first};resetTask();go('drill');
}
function resetTask(){Object.assign(D,{ans:[],checked:false,hints:0,crit:[],graded:false})}
function vDrill(){
  const t=BY[D.ids[D.i]];
  const reveal=D.checked;
  let fb='';
  if(D.checked&&t.type!=='open'){
    const ok=t.closed?choiceOk(t,D.ans):numOk(t,D.ans);
    fb=ok?`<div class="fb ok">Dobrze! +${t.p} ${pl(t.p)}</div>`:`<div class="fb bad">Jeszcze nie. Poprawna odpowiedź: ${ansText(t)}</div>`;
  }
  if(D.graded){const n=D.crit.filter(Boolean).length;fb=`<div class="fb ${n===t.p?'ok':'info'}">Twoja ocena: ${n} / ${t.p} ${pl(t.p)}. ${n===t.p?'Świetnie!':'Zadanie trafi do powtórki.'}</div>`}
  const hintsHTML=D.hints?`<ol class="hints">${t.h.slice(0,D.hints).map((h,i)=>`<li><b>Podpowiedź ${i+1}</b>${h}</li>`).join('')}</ol>`:'';
  const solHTML=reveal?`<div class="sol"><h3>Rozwiązanie</h3><p>${t.s}</p>${t.type==='open'?`<p style="margin-top:10px"><b>Oceń się jak egzaminator.</b> Zaznacz to, co masz w swoim rozwiązaniu:</p>${critHTML(t,D.crit,'d')}`:''}</div>`:'';
  const canCheck=t.closed?t.parts.every((p,i)=>D.ans[i]):t.type==='num'?String(D.ans||'').trim()!=='':true;
  app.innerHTML=`<div class="stack">
  <div class="row" style="justify-content:space-between"><button class="back" type="button" data-go="topics">← Działy</button><span class="eyebrow">${D.title}</span></div>
  <div class="dots" role="navigation" aria-label="Zadania">${D.ids.map((id,i)=>`<button type="button" data-i="${i}" class="${S.res[id]||''}" aria-current="${i===D.i}" aria-label="Zadanie ${i+1}">${i+1}</button>`).join('')}</div>
  ${taskHTML(t,D.checked||t.type==='open'?D.ans:D.ans,reveal,`Zadanie ${D.i+1} z ${D.ids.length}`,'d')}
  ${hintsHTML}${fb}${solHTML}
  <div class="row">
    ${!reveal?`<button class="btn" type="button" id="check" ${canCheck?'':'disabled'}>${t.type==='open'?'Pokaż rozwiązanie':'Sprawdź'}</button>`:''}
    ${reveal&&t.type==='open'&&!D.graded?`<button class="btn" type="button" id="grade">Zapisz moją ocenę</button>`:''}
    ${!reveal&&D.hints<t.h.length?`<button class="btn ghost" type="button" id="hint">Podpowiedź (${t.h.length-D.hints})</button>`:''}
    ${!reveal&&t.type!=='open'?`<button class="btn quiet" type="button" id="giveup">Pokaż rozwiązanie</button>`:''}
    ${reveal?`<button class="btn ${t.type==='open'&&!D.graded?'quiet':''}" type="button" id="next">${D.i<D.ids.length-1?'Następne zadanie →':'Wróć do działów'}</button>`:''}
    ${reveal?`<button class="btn quiet" type="button" id="again">Spróbuj jeszcze raz</button>`:''}
  </div></div>`;
  wireAnswers(app,t,D.ans,(a)=>{D.ans=a;const c=document.getElementById('check');if(c&&t.closed)vDrill();else if(c)c.disabled=String(a||'').trim()===''});
  app.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{D.i=+b.dataset.i;resetTask();vDrill()});
  const $=id=>document.getElementById(id);
  if($('check'))$('check').onclick=()=>{D.checked=true;if(t.type!=='open'){S.res[t.id]=(t.closed?choiceOk(t,D.ans):numOk(t,D.ans))?'ok':'bad';save()}vDrill()};
  if($('giveup'))$('giveup').onclick=()=>{D.checked=true;S.res[t.id]='bad';save();vDrill()};
  if($('hint'))$('hint').onclick=()=>{D.hints++;vDrill()};
  if($('grade'))$('grade').onclick=()=>{D.graded=true;S.res[t.id]=D.crit.filter(Boolean).length===t.p?'ok':'bad';save();vDrill()};
  if($('next'))$('next').onclick=()=>{if(D.i<D.ids.length-1){D.i++;resetTask();vDrill();window.scrollTo(0,0)}else go('topics')};
  if($('again'))$('again').onclick=()=>{resetTask();vDrill()};
  app.querySelectorAll('[data-crit]').forEach(c=>c.onchange=()=>{D.crit[+c.dataset.crit]=c.checked});
}
function wireAnswers(root,t,cur,onChange){
  root.querySelectorAll(`.opt:not(:disabled)`).forEach(b=>{if(!b.closest('.task'))return;b.onclick=()=>{const a=(cur||[]).slice();a[+b.dataset.p]=b.dataset.k;onChange(a)}});
  const inp=root.querySelector(`[data-in="${t.id}"]`);
  if(inp&&!inp.readOnly){inp.oninput=()=>onChange(inp.value);if(t.type==='num')inp.onkeydown=e=>{if(e.key==='Enter'){const c=document.getElementById('check');if(c&&!c.disabled)c.click()}}}
}

// ---------- EXAM ----------
const EXAM_MIN=125;
function buildPaper(){
  // closed part: 15 tasks, spread across topics
  const byT={};BANK.filter(t=>t.closed).forEach(t=>(byT[t.t]=byT[t.t]||[]).push(t.id));
  Object.keys(byT).forEach(k=>byT[k]=shuffle(byT[k]));
  const order=shuffle(Object.keys(byT));const closed=[];let r=0;
  while(closed.length<15){const k=order[r%order.length];if(byT[k].length)closed.push(byT[k].pop());r++}
  // open part: tasks worth 2–4 pts, exactly 15 pts, 5–6 tasks, distinct topics, at least 2 written-out tasks
  const pool=shuffle(BANK.filter(t=>t.type==='open'||(t.type==='num'&&t.p>=2)));
  let best=null;
  (function dfs(i,pick,sum,topics){
    if(best)return;
    if(sum===15&&pick.length>=5&&pick.filter(t=>t.type==='open').length>=2){best=pick.slice();return}
    if(i>=pool.length||pick.length>=6||sum>=15)return;
    const t=pool[i];
    if(!topics.has(t.t)&&sum+t.p<=15){pick.push(t);topics.add(t.t);dfs(i+1,pick,sum+t.p,topics);pick.pop();topics.delete(t.t)}
    dfs(i+1,pick,sum,topics);
  })(0,[],0,new Set());
  const open=best.sort((a,b)=>a.p-b.p).map(t=>t.id);
  return {id:Date.now(),closed:shuffle(closed),open,ans:{},self:{},endAt:Date.now()+EXAM_MIN*6e4,pausedLeft:null,done:false};
}
function left(){const e=S.exam;return e.pausedLeft!=null?e.pausedLeft:Math.max(0,e.endAt-Date.now())}
const mmss=ms=>{const s=Math.ceil(ms/1000),m=Math.floor(s/60);return `${m}:${String(s%60).padStart(2,'0')}`};
function vExam(){
  if(!S.exam||S.exam.done){
    app.innerHTML=`<div class="stack" style="gap:20px"><div class="stack" style="gap:6px"><h1>Egzamin próbny</h1><p class="muted">Arkusz losowany z bazy zadań, ułożony tak jak prawdziwy egzamin.</p></div>
    <div class="task"><ul class="stack" style="gap:8px;margin:0;padding-left:20px">
      <li><b>15 zadań zamkniętych</b> po 1 punkcie: wybór odpowiedzi, prawda/fałsz, dobieranie.</li>
      <li><b>Zadania otwarte</b> za 2–4 punkty, razem 15 punktów. Zapisz rozwiązanie na kartce lub w polu tekstowym.</li>
      <li><b>125 minut.</b> Odpowiedzi sprawdzisz dopiero po zakończeniu. Zadania otwarte ocenisz sam, według kryteriów egzaminatora.</li>
      <li>Przygotuj kartkę, długopis i linijkę. Na egzaminie nie wolno używać kalkulatora.</li></ul></div>
    <div class="row"><button class="btn" type="button" id="start">Rozpocznij egzamin</button>${S.exam&&S.exam.done?`<button class="btn quiet" type="button" id="last">Zobacz ostatni wynik</button>`:''}</div></div>`;
    document.getElementById('start').onclick=()=>{S.exam=buildPaper();save();vExam()};
    const l=document.getElementById('last');if(l)l.onclick=()=>go('results');
    return;
  }
  const e=S.exam,paused=e.pausedLeft!=null;
  const all=[...e.closed,...e.open];
  const answered=all.filter(id=>{const a=e.ans[id],t=BY[id];return t.closed?a&&t.parts.every((p,i)=>a[i]):a&&String(a).trim()}).length;
  app.innerHTML=`<div class="stack">
  <div class="ebar"><div class="stack" style="gap:0"><span class="eyebrow">Pozostały czas</span><span class="timer" id="timer">${mmss(left())}</span></div>
  <span class="muted hist">${answered}/${all.length} z odpowiedzią</span>
  <div class="row"><button class="btn quiet" type="button" id="pause">${paused?'Wznów':'Pauza'}</button><button class="btn" type="button" id="finish">Zakończ</button></div></div>
  ${paused?`<div class="pause"><h2>Pauza</h2><p class="muted">Czas jest zatrzymany. Zadania są ukryte.</p><button class="btn" type="button" id="resume">Wznów egzamin</button></div>`:
  `<p class="part">Zadania zamknięte · 1–${e.closed.length}</p>
  ${e.closed.map((id,i)=>`<div data-task="${id}">${taskHTML(BY[id],e.ans[id],false,`Zadanie ${i+1}.`,'e'+id)}</div>`).join('')}
  <p class="part">Zadania otwarte · ${e.closed.length+1}–${all.length}</p>
  ${e.open.map((id,i)=>`<div data-task="${id}">${taskHTML(BY[id],e.ans[id],false,`Zadanie ${e.closed.length+i+1}.`,'e'+id)}</div>`).join('')}
  <div class="row"><button class="btn" type="button" id="finish2">Zakończ i sprawdź</button></div>`}
  </div>`;
  app.querySelectorAll('[data-task]').forEach(box=>{const t=BY[box.dataset.task];
    const wire=()=>wireAnswers(box,t,e.ans[t.id],a=>{e.ans[t.id]=a;save();if(t.closed){box.innerHTML=taskHTML(t,a,false,box.querySelector('.num').textContent,'e'+t.id);wire()}updCount()});wire()});
  const $=id=>document.getElementById(id);
  const togglePause=()=>{if(e.pausedLeft!=null){e.endAt=Date.now()+e.pausedLeft;e.pausedLeft=null}else e.pausedLeft=left();save();vExam()};
  $('pause').onclick=togglePause;if($('resume'))$('resume').onclick=togglePause;
  [$('finish'),$('finish2')].forEach(b=>{if(!b)return;let armed=false;b.onclick=()=>{if(!armed){armed=true;b.textContent='Na pewno? Kliknij ponownie';b.classList.add('danger');setTimeout(()=>{armed=false;b.textContent=b.id==='finish'?'Zakończ':'Zakończ i sprawdź';b.classList.remove('danger')},4000);return}finishExam()}});
  function updCount(){const n=all.filter(id=>{const a=e.ans[id],t=BY[id];return t.closed?a&&t.parts.every((p,i)=>a[i]):a&&String(a).trim()}).length;const el=app.querySelector('.ebar .hist');if(el)el.textContent=`${n}/${all.length} z odpowiedzią`}
}
function finishExam(){const e=S.exam;if(e.pausedLeft==null)e.pausedLeft=left();e.done=true;e.usedMs=EXAM_MIN*6e4-e.pausedLeft;recordHist();save();go('results')}
function examScore(e){
  let total=0;const per={};
  [...e.closed,...e.open].forEach(id=>{const t=BY[id];let pts=0;
    if(t.closed)pts=choiceOk(t,e.ans[id])?1:0;
    else if(t.type==='num')pts=numOk(t,e.ans[id])?t.p:0;
    else pts=(e.self[id]||[]).filter(Boolean).length;
    total+=pts;per[t.t]=per[t.t]||[0,0];per[t.t][0]+=pts;per[t.t][1]+=t.p});
  return{total,per};
}
function recordHist(){const e=S.exam,sc=examScore(e).total,h=S.hist.find(x=>x.id===e.id);if(h)h.score=sc;else S.hist.push({id:e.id,score:sc});S.hist=S.hist.slice(-10)}
setInterval(()=>{
  if(!S.exam||S.exam.done||S.exam.pausedLeft!=null)return;
  const ms=left();
  if(ms<=0){finishExam();return}
  const el=document.getElementById('timer');if(el&&view==='exam'){el.textContent=mmss(ms);el.classList.toggle('low',ms<10*6e4)}
},1000);

// ---------- RESULTS ----------
function vResults(){
  const e=S.exam;if(!e||!e.done){go('exam');return}
  const {total,per}=examScore(e);
  const openSelf=e.open.filter(id=>BY[id].type==='open');
  const pending=openSelf.filter(id=>!e.self[id]).length;
  const all=[...e.closed,...e.open];
  app.innerHTML=`<div class="stack" style="gap:22px">
  <h1>Wynik egzaminu próbnego</h1>
  <div class="score"><div class="big">${total}<small> / 30</small></div><div class="stack" style="gap:6px"><b>${Math.round(total/30*100)}% punktów</b><span class="muted">Czas pisania: ${mmss(e.usedMs||0)} z ${EXAM_MIN}:00</span>${pending?`<span class="fb info">Oceń ${pending} ${pending===1?'zadanie otwarte':'zadania otwarte'} poniżej – zaznacz kryteria, które spełnia Twoje rozwiązanie. Wynik zaktualizuje się od razu.</span>`:''}</div></div>
  <section class="stack" style="gap:8px"><h2>Wyniki według działów</h2><div class="tbl-wrap"><table class="brk"><tr><th>Dział</th><th>Punkty</th></tr>
  ${TOPICS.filter(([id])=>per[id]).map(([id,n])=>`<tr><td>${n}</td><td>${per[id][0]} / ${per[id][1]}</td></tr>`).join('')}</table></div></section>
  <section class="stack"><h2>Przegląd zadań</h2>
  ${all.map((id,i)=>{const t=BY[id];const a=e.ans[id];
    let st='';if(t.closed)st=choiceOk(t,a)?'<div class="fb ok">Dobrze · 1 pkt</div>':`<div class="fb bad">${a&&a.length?'Źle':'Brak odpowiedzi'} · poprawnie: ${ansText(t)}</div>`;
    else if(t.type==='num')st=numOk(t,a)?`<div class="fb ok">Dobrze · ${t.p} pkt</div>`:`<div class="fb bad">${a?'Źle':'Brak odpowiedzi'} · poprawnie: ${ansText(t)}</div>`;
    return `<div class="stack" style="gap:10px" data-rv="${id}">${taskHTML(t,a,true,`Zadanie ${i+1}.`,'r'+id)}${st}<div class="sol"><h3>Rozwiązanie</h3><p>${t.s}</p>${t.type==='open'?`<p style="margin-top:10px"><b>Twoja ocena:</b></p>${critHTML(t,e.self[id],'r'+id)}`:''}</div></div>`}).join('')}
  </section>
  <div class="row"><button class="btn" type="button" id="newex">Nowy egzamin próbny</button><button class="btn quiet" type="button" data-go="topics">Ćwicz słabsze działy</button></div></div>`;
  app.querySelectorAll('[data-rv]').forEach(box=>{const id=box.dataset.rv;box.querySelectorAll('[data-crit]').forEach(c=>c.onchange=()=>{
    const arr=e.self[id]||BY[id].crit.map(()=>false);arr[+c.dataset.crit]=c.checked;e.self[id]=arr;recordHist();save();
    const sc=examScore(e).total;app.querySelector('.score .big').innerHTML=`${sc}<small> / 30</small>`;app.querySelector('.score b').textContent=`${Math.round(sc/30*100)}% punktów`})});
  document.getElementById('newex').onclick=()=>{S.exam=buildPaper();save();go('exam')};
}

go('home');
</script>
